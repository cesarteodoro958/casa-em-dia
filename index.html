<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Casa em Dia · Controle financeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F7F5;--surface:#FFFFFF;--border:#E4E6E1;--text:#16201D;--text-2:#5B6762;--muted:#8D9692;
  --primary:#0E5C4F;--primary-h:#0A463C;--primary-s:#E6F0ED;--gold:#B8893A;
  --income:#1F8A5B;--expense:#C2413B;--warn:#C98A1B;--info:#2F5D8A;--on-primary:#fff;
  --c1:#0E5C4F;--c2:#2F5D8A;--c3:#B8893A;--c4:#8A5A44;--c5:#5E7C6B;--c6:#7A6C9E;--c7:#A8554E;--c8:#6B7F8C;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--r1:8px;--r2:12px;--shadow:0 1px 2px rgba(22,32,29,.06);
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
:root[data-theme="dark"]{--bg:#0F1412;--surface:#161D1A;--border:#26302C;--text:#E8ECEA;--text-2:#9AA5A0;--muted:#7C8782;--primary:#3FA58F;--primary-h:#5BBBA6;--primary-s:#1B2B27;--on-primary:#0F1412;--income:#4DBB8A;--expense:#E0746E;--warn:#DDA23A;--info:#6C9BC8;--shadow:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1412;--surface:#161D1A;--border:#26302C;--text:#E8ECEA;--text-2:#9AA5A0;--muted:#7C8782;--primary:#3FA58F;--primary-h:#5BBBA6;--primary-s:#1B2B27;--on-primary:#0F1412;--income:#4DBB8A;--expense:#E0746E;--warn:#DDA23A;--info:#6C9BC8;--shadow:none}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--text);font:400 14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.cents{font-size:.65em;color:var(--text-2);font-weight:500}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* layout */
#app{display:flex;min-height:100%}
.side{display:none;width:232px;flex:none;background:var(--surface);border-right:1px solid var(--border);padding:calc(var(--s5) + env(safe-area-inset-top,0px)) var(--s3) var(--s4);position:sticky;top:0;height:100vh;flex-direction:column;gap:var(--s1);transition:width .2s}
.side.mini{width:64px}.side.mini .lbl{display:none}
.brand{display:flex;align-items:center;gap:var(--s2);font-weight:600;font-size:16px;padding:0 var(--s2) var(--s4)}
.brand b{width:28px;height:28px;border-radius:var(--r1);background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-size:14px;flex:none}
.nav{display:flex;align-items:center;gap:var(--s3);padding:10px var(--s3);border-radius:var(--r1);color:var(--text-2);background:none;border:0;cursor:pointer;width:100%;text-align:left;font-weight:500;transition:background .15s}
.nav:hover{background:var(--bg)}.nav[aria-current=page]{background:var(--primary-s);color:var(--primary)}
.main{flex:1;min-width:0;padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--border);padding:calc(var(--s3) + env(safe-area-inset-top,0px)) var(--s4) var(--s3);display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2) var(--s3)}
.top .sp{flex:1}
.content{max-width:1200px;margin:0 auto;padding:var(--s4);display:grid;gap:var(--s4)}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--border);display:grid;grid-template-columns:1fr 1fr 64px 1fr 1fr;align-items:center;padding:6px var(--s2) calc(6px + env(safe-area-inset-bottom,0px))}
.bnav .nav{flex-direction:column;gap:2px;font-size:12px;padding:6px 0;justify-content:center;text-align:center}
.fab{width:52px;height:52px;border-radius:50%;background:var(--primary);color:var(--on-primary);border:0;display:grid;place-items:center;margin:-22px auto 0;cursor:pointer;box-shadow:0 2px 8px rgba(14,92,79,.3)}
.fab:hover{background:var(--primary-h)}
@media(min-width:900px){.side{display:flex}.bnav{display:none}.main{padding-bottom:var(--s5)}.content{padding:var(--s5);grid-template-columns:repeat(12,1fr)}.c8{grid-column:span 8}.c4{grid-column:span 4}.c12{grid-column:span 12}.top{padding-left:var(--s5);padding-right:var(--s5)}.deskfab{display:inline-flex!important}}
.deskfab{display:none}
/* components */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:var(--s4);box-shadow:var(--shadow)}
.card h2{font-size:14px;font-weight:600;color:var(--text-2);margin-bottom:var(--s3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);height:40px;padding:0 var(--s4);border-radius:var(--r1);border:1px solid var(--border);background:var(--surface);cursor:pointer;font-weight:500;transition:background .15s,border-color .15s}
.btn:hover{background:var(--bg)}.btn.p{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}.btn.p:hover{background:var(--primary-h)}
.btn.g{border-color:transparent;background:none}.btn.ic{width:40px;padding:0}.btn.d{color:var(--expense)}
.field{display:grid;gap:6px}.field label{font-size:12px;color:var(--text-2);font-weight:500}
.inp{height:44px;padding:0 var(--s3);border:1px solid var(--border);border-radius:var(--r1);background:var(--surface);width:100%}
.inp:hover{border-color:var(--muted)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--border);border-radius:var(--r1);padding:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:6px;cursor:pointer;color:var(--text-2);font-weight:500;font-size:13px}
.seg button[aria-pressed=true]{background:var(--primary-s);color:var(--primary)}
.chips{display:flex;flex-wrap:wrap;gap:var(--s2)}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed=true]{background:var(--primary-s);border-color:var(--primary);color:var(--primary)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--border);color:var(--text-2)}
.badge.ok{color:var(--income)}.badge.warn{color:var(--warn)}.badge.bad{color:var(--expense)}.badge.info{color:var(--info)}
.bar{height:8px;border-radius:999px;background:var(--bg);overflow:hidden;border:1px solid var(--border)}
.bar>i{display:block;height:100%;background:var(--primary);border-radius:999px;transition:width .25s}
.bar.warn>i{background:var(--warn)}.bar.bad>i{background:var(--expense)}
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;font-weight:600;color:#fff;flex:none}
.tbl{width:100%;border-collapse:collapse}.tbl th{font-size:12px;color:var(--muted);font-weight:500;text-align:left;padding:var(--s2) var(--s3);border-bottom:1px solid var(--border)}
.tbl td{padding:var(--s3);border-bottom:1px solid var(--border)}.tbl .r{text-align:right}.tbl tr:last-child td{border:0}
.sk{background:linear-gradient(90deg,var(--border),var(--bg),var(--border));background-size:200% 100%;animation:sk 1.2s linear infinite;border-radius:var(--r1);height:16px}
@keyframes sk{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.empty{text-align:center;padding:var(--s6) var(--s4);color:var(--text-2);display:grid;gap:var(--s2);justify-items:center}
.empty svg{width:32px;height:32px;color:var(--muted)}.empty b{color:var(--text)}
.row{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) 0;border-bottom:1px solid var(--border)}.row:last-child{border:0}
.row .grow{flex:1;min-width:0}.row .grow small{display:block;color:var(--muted);font-size:12px}.row .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cic{width:36px;height:36px;border-radius:var(--r1);display:grid;place-items:center;background:var(--primary-s);color:var(--primary);flex:none}
.day{font-size:12px;color:var(--muted);font-weight:500;padding:var(--s3) 0 0;text-transform:capitalize}
.big{font-size:40px;font-weight:600;letter-spacing:-.5px;line-height:1.1}.big .cents{font-size:20px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3);margin:var(--s4) 0}
.kpis small{display:block;font-size:12px;color:var(--text-2)}.kpis b{font-size:20px;font-weight:600}
.pos{color:var(--income)}.neg{color:var(--expense)}
/* modal / sheet */
.scrim{position:fixed;inset:0;background:rgba(10,16,14,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fd .15s}
.sheet{background:var(--surface);width:100%;max-height:92vh;overflow:auto;border-radius:var(--r2) var(--r2) 0 0;padding:var(--s4) var(--s4) calc(var(--s4) + env(safe-area-inset-bottom,0px));display:grid;gap:var(--s4);animation:up .2s ease-out}
.sheet header{display:flex;align-items:center;justify-content:space-between}.sheet h3{font-size:16px;font-weight:600}
@media(min-width:900px){.scrim{align-items:center}.sheet{width:440px;border-radius:var(--r2)}}
@keyframes up{from{transform:translateY(16px);opacity:0}}@keyframes fd{from{opacity:0}}
.amount{font-size:40px;font-weight:600;height:72px;text-align:center;letter-spacing:-.5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--text);color:var(--bg);padding:10px var(--s4);border-radius:var(--r1);display:flex;gap:var(--s4);align-items:center;animation:fd .15s;max-width:92vw}
.toast button{background:none;border:0;color:inherit;font-weight:600;text-decoration:underline;cursor:pointer}
@media(min-width:900px){.toast{bottom:var(--s5)}}
.pick{display:grid;place-items:center;min-height:100vh;padding:var(--s4)}.pick .card{max-width:400px;width:100%;display:grid;gap:var(--s4)}
.pick .opt{display:flex;align-items:center;gap:var(--s3);padding:var(--s3);border:1px solid var(--border);border-radius:var(--r1);background:var(--surface);cursor:pointer;font-weight:500;width:100%}
.pick .opt:hover{border-color:var(--primary)}
.muted{color:var(--text-2)}.note{font-size:12px;color:var(--muted)}

@media(max-width:899px){
  body{font-size:14px;overflow-x:hidden}
  .main{width:100%;min-width:0}
  .top{display:grid;grid-template-columns:minmax(0,1fr) auto;padding:10px 12px calc(10px + env(safe-area-inset-top,0px));gap:8px}
  .top>div:first-child{grid-column:1/-1;justify-content:center;width:100%}
  .top>div:first-child b{min-width:0!important;font-size:15px}
  .top>.seg{grid-column:1/-1;width:100%;justify-content:stretch}
  .top>.seg button{flex:1;min-height:38px}
  .top>.sp{display:none}
  .top>.field{grid-column:1;width:100%!important}
  .top>.btn.g.ic[data-a="tema"]{grid-column:2;align-self:end}
  .content{padding:12px;gap:12px;width:100%;overflow:hidden}
  .card{padding:14px;border-radius:12px;min-width:0}
  .big{font-size:32px}
  .big .cents{font-size:17px}
  .kpis{gap:8px;margin:14px 0}
  .kpis b{font-size:17px}
  .kpis small{font-size:11px}
  .row{gap:10px}
  .row .t{max-width:48vw}
  .tbl{font-size:13px}
  .sheet{max-height:88vh;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px))}
  .amount{font-size:36px}
  .chips{gap:7px}
  .chip{padding:8px 10px}
  .bnav{padding-top:5px}
  .bnav .nav{min-height:48px}
  .fab{width:54px;height:54px}
}

/* ---------- intro / visual identity ---------- */
.intro{min-height:100svh;display:grid;place-items:center;padding:18px;position:relative;overflow:hidden;background:radial-gradient(circle at 15% 15%,rgba(14,92,79,.12),transparent 34%),radial-gradient(circle at 90% 80%,rgba(184,137,58,.13),transparent 36%),var(--bg)}
.intro:before,.intro:after{content:"";position:absolute;border-radius:50%;filter:blur(1px);opacity:.35;pointer-events:none}
.intro:before{width:280px;height:280px;background:var(--primary-s);top:-90px;right:-70px;animation:drift 8s ease-in-out infinite}
.intro:after{width:220px;height:220px;background:rgba(184,137,58,.14);bottom:-80px;left:-60px;animation:drift 10s ease-in-out infinite reverse}
.intro-wrap{width:min(1080px,100%);display:grid;grid-template-columns:1.05fr .95fr;gap:28px;align-items:center;position:relative;z-index:1}
.intro-copy{padding:8px}
.intro-kicker{display:inline-flex;align-items:center;gap:8px;padding:7px 11px;border:1px solid var(--border);border-radius:999px;background:rgba(255,255,255,.58);backdrop-filter:blur(10px);color:var(--primary);font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
:root[data-theme="dark"] .intro-kicker{background:rgba(22,29,26,.68)}
.intro-copy h1{font-size:clamp(40px,7vw,74px);line-height:.96;letter-spacing:-2.5px;margin:18px 0 16px;font-weight:600;max-width:720px}
.intro-copy h1 span{color:var(--primary)}
.intro-copy p{font-size:clamp(16px,2vw,19px);line-height:1.55;color:var(--text-2);max-width:610px}
.intro-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.intro-actions .btn{height:48px;padding:0 20px;border-radius:12px}
.intro-note{display:flex;gap:14px;flex-wrap:wrap;margin-top:16px;color:var(--muted);font-size:12px}.intro-note span{display:inline-flex;align-items:center;gap:6px}
.intro-art{min-height:470px;border:1px solid var(--border);border-radius:28px;background:linear-gradient(145deg,rgba(255,255,255,.72),rgba(255,255,255,.34));backdrop-filter:blur(16px);box-shadow:0 22px 60px rgba(22,32,29,.10);position:relative;overflow:hidden;padding:18px}
:root[data-theme="dark"] .intro-art{background:linear-gradient(145deg,rgba(22,29,26,.86),rgba(15,20,18,.55))}
.intro-art:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 0 42%,rgba(255,255,255,.18) 50%,transparent 58%);transform:translateX(-120%);animation:shine 5s ease-in-out infinite}
.crop{position:absolute;display:grid;place-items:center;border-radius:50%;filter:drop-shadow(0 18px 20px rgba(22,32,29,.14));animation:float 5s ease-in-out infinite}
.crop svg{width:100%;height:100%}.crop.corn{width:150px;height:150px;top:56px;left:38px;animation-delay:-1s}.crop.soy{width:132px;height:132px;right:40px;top:120px;animation-delay:-2.2s}.crop.cotton{width:145px;height:145px;left:105px;bottom:52px;animation-delay:-3.4s}
.art-panel{position:absolute;right:24px;bottom:28px;width:235px;padding:14px;border-radius:16px;background:rgba(255,255,255,.78);border:1px solid rgba(228,230,225,.8);backdrop-filter:blur(12px);box-shadow:0 12px 30px rgba(22,32,29,.10);animation:panelFloat 6s ease-in-out infinite}
:root[data-theme="dark"] .art-panel{background:rgba(22,29,26,.82);border-color:var(--border)}
.art-panel strong{display:block;font-size:15px;margin-bottom:8px}.art-bars{display:grid;gap:7px}.art-bars i{height:8px;border-radius:999px;background:var(--primary);display:block;transform-origin:left;animation:grow 2s ease-out both}.art-bars i:nth-child(2){width:74%;background:var(--gold);animation-delay:.2s}.art-bars i:nth-child(3){width:52%;background:var(--income);animation-delay:.4s}
.visual-pill{position:absolute;left:20px;top:22px;padding:8px 11px;border-radius:10px;background:var(--surface);border:1px solid var(--border);font-size:11px;color:var(--text-2);box-shadow:var(--shadow);animation:float 5.5s ease-in-out infinite}.visual-pill b{color:var(--primary)}
/* richer dashboard motion */
.card{transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease}.card:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(22,32,29,.08);border-color:color-mix(in srgb,var(--primary) 22%,var(--border))}
.big{animation:rise .45s ease both}.kpis>div{animation:rise .5s ease both}.kpis>div:nth-child(2){animation-delay:.06s}.kpis>div:nth-child(3){animation-delay:.12s}.row{transition:background .18s ease,transform .18s ease;border-radius:10px}.row:hover{background:var(--bg);transform:translateX(2px)}
.bar>i{position:relative;overflow:hidden}.bar>i:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.38),transparent);transform:translateX(-100%);animation:barShine 2.6s ease-in-out infinite}
.dashboard-strip{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}.spark{height:100px;display:flex;align-items:flex-end;gap:6px;padding-top:8px}.spark button{flex:1;min-width:8px;height:var(--h);border:0;border-radius:7px 7px 3px 3px;background:var(--primary);opacity:.72;cursor:pointer;transition:height .25s,opacity .2s,transform .2s}.spark button:hover,.spark button[aria-pressed=true]{opacity:1;transform:translateY(-4px)}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-13px) rotate(1deg)}}
@keyframes panelFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes drift{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(20px,16px,0)}}
@keyframes shine{0%,55%{transform:translateX(-120%)}75%,100%{transform:translateX(120%)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes barShine{0%,55%{transform:translateX(-120%)}75%,100%{transform:translateX(120%)}}
@media(max-width:899px){.intro{padding:12px}.intro-wrap{grid-template-columns:1fr;gap:14px}.intro-copy{padding:10px 4px}.intro-copy h1{font-size:clamp(40px,13vw,58px);letter-spacing:-2px}.intro-copy p{font-size:15px}.intro-actions .btn{width:100%}.intro-art{min-height:330px;border-radius:22px}.crop.corn{width:105px;height:105px;top:34px;left:18px}.crop.soy{width:94px;height:94px;right:18px;top:86px}.crop.cotton{width:102px;height:102px;left:60px;bottom:34px}.art-panel{right:12px;bottom:16px;width:190px;padding:11px}.visual-pill{left:12px;top:12px}.dashboard-strip{grid-template-columns:1fr}.card:hover{transform:none}}
@media(prefers-reduced-motion:reduce){.crop,.art-panel,.intro-art:before,.intro:before,.intro:after,.big,.kpis>div,.bar>i:after{animation:none!important}}

</style>

function brlT(v){return (v<0?"-":"")+"R$ "+Math.abs(v).toFixed(2).replace(".",",").replace(/\B(?=(\d{3})+(?!\d))/g,".")}
var MES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];

function iso(y,m,d){return y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0")}

/* ---------- dados de exemplo ---------- */
function seed(){

  return{
    v:4,
    pessoas:[{id:"p1",nome:"Eu",cor:"#0E5C4F"},{id:"p2",nome:"Esposa",cor:"#7A6C9E"}],
    contas:[],
    cartoes:[],

/* ---------- persistência ---------- */
var S=null,db=null,docRef=null,saveT=null,loading=true,unsub=null;
var ui={tela:"home",mes:mk(today()),visao:"casal",perfil:null,mini:false,busca:"",sheet:false,toast:null,intro:true};
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function persist(){
  var json=JSON.stringify(S);lsSet(LS,json);
  if(docRef){clearTimeout(saveT);saveT=setTimeout(function(){docRef.set({json:json}).catch(function(){})},400)}
}
function load(){
  var raw=lsGet(LS);if(raw){try{S=JSON.parse(raw)}catch(e){}}
  ui.perfil=lsGet(LSP);var th=lsGet(LST);if(th)document.documentElement.setAttribute("data-theme",th);
  var ready=function(){loading=false;render()};
  if(S){ready()}
  if(window.claude&&claude.use){
    claude.use("db").then(function(d){
      if(!d){if(!S){S=seed();persist()}return ready()}
      db=d;docRef=db.doc(DOC);
      unsub=docRef.onSnapshot(function(snap){
        if(snap.metadata&&snap.metadata.hasPendingWrites)return;
        var dt=snap.exists&&snap.data();
        if(dt&&dt.json){try{S=JSON.parse(dt.json);lsSet(LS,dt.json)}catch(e){}}
        else if(!S){S=seed()}
        if(!snap.exists){persist()}
        ready();
      },function(){docRef=null;if(!S){S=seed();persist()}ready()});
    }).catch(function(){if(!S){S=seed();persist()}ready()});
  }else{if(!S){S=seed();persist()}ready()}
}

/* ---------- derivados ---------- */
function pessoa(id){return S.pessoas.filter(function(p){return p.id===id})[0]||{nome:"?",cor:"#6B7F8C"}}
function cat(id){return S.categorias.filter(function(c){return c.id===id})[0]||{nome:"Sem categoria",cor:7,icone:"list"}}
function conta(l){var c=S.contas.filter(function(x){return x.id===l.conta_id})[0]||S.cartoes.filter(function(x){return x.id===l.cartao_id})[0];return c?c.nome:"—"}
function lancs(mes){return S.lancamentos.filter(function(l){return(!mes||mk(l.data)===mes)&&(ui.visao==="casal"||l.pessoa_id===ui.visao)})}
function totais(mes){var e=0,s=0;lancs(mes).forEach(function(l){if(l.tipo==="receita")e+=l.valor;else if(l.tipo==="despesa")s+=l.valor});return{e:e,s:s,sobra:e-s}}
function av(id){var p=pessoa(id);return '<span class="av" style="background:'+p.cor+'" title="'+esc(p.nome)+'">'+esc(p.nome[0])+'</span>'}
function catc(c){return 'var(--c'+(c.cor+1)+')'}

  var monthly=[]; for(var mi=5;mi>=0;mi--){var mm=madd(ui.mes,-mi),tt=totais(mm);monthly.push({m:mm,v:tt.s});} var maxv=Math.max.apply(null,monthly.map(function(x){return x.v}))||1;

function empty(t,s){return '<div class="empty">'+ic("inbox")+'<b>'+t+'</b><span>'+s+'</span></div>'}

    h+='<div class="row"><span class="cic" style="color:'+catc(c)+'">'+ic(c.icone)+'</span><div class="grow"><div class="t">'+esc(l.descricao)+'</div><small>'+esc(c.nome)+' · '+esc(conta(l))+'</small></div>'+av(l.pessoa_id)+'<span class="'+(rec?"pos":"")+'" style="min-width:96px;text-align:right">'+(rec?"+":"")+brl(l.valor)+'</span></div>'});

}
/* ---------- novo lançamento (base) ---------- */
var draft={cat:null};
function sheetHtml(){
  var cs=S.categorias.filter(function(c){return c.id!=="sal"});
  return '<div class="scrim" data-a="fecha"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="st"><header><h3 id="st">Novo lançamento</h3><button class="btn g ic" data-a="fecha" aria-label="Fechar">'+ic("x")+'</button></header>'
  +'<div class="field"><label for="val">Valor</label><input id="val" class="inp amount num" inputmode="decimal" placeholder="0,00" autocomplete="off"></div>'
  +'<div class="field"><label>Categoria</label><div class="chips">'+cs.map(function(c){return'<button class="chip" data-a="cat" data-id="'+c.id+'" aria-pressed="'+(draft.cat===c.id)+'">'+ic(c.icone).replace('class="i"','class="i" style="width:16px;height:16px"')+esc(c.nome)+'</button>'}).join("")+'</div></div>'
  +'<div class="field"><label for="desc">Descrição</label><input id="desc" class="inp" placeholder="Ex.: Supermercado"></div>'
  +'<button class="btn p" style="height:48px" data-a="salva">Salvar despesa</button></div></div>'}
function toast(msg,undo){ui.toast={msg:msg,undo:undo};render();clearTimeout(toast.t);toast.t=setTimeout(function(){ui.toast=null;render()},5000)}
function salvar(){
  var v=parseFloat(($("#val").value||"").replace(/\./g,"").replace(",","."));
  if(!(v>0)||!draft.cat){toast("Informe o valor e a categoria.");return}
  var l={id:uid(),tipo:"despesa",valor:v,data:today(),descricao:$("#desc").value.trim()||cat(draft.cat).nome,categoria_id:draft.cat,conta_id:"cc",cartao_id:null,pessoa_id:ui.perfil,compartilhado:true,parcela_atual:1,parcelas_total:1,recorrencia_id:null,pago:true};
  S.lancamentos.push(l);persist();ui.sheet=false;ui._f=0;draft.cat=null;ui._undo=l.id;toast("Despesa salva",true)}

/* ---------- eventos ---------- */
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-a]");if(!t)return;var a=t.getAttribute("data-a");
  if(a==="fecha"&&e.target.closest(".sheet")&&!e.target.closest("button.ic"))return;
  if(a==="comecar"){ui.intro=false;render();return}
  if(a==="preview"){ui.intro=false;ui.perfil=lsGet(LSP)||null;if(!ui.perfil)ui.perfil="p1";render();return}
  if(a==="spark"){ui.mes=t.dataset.m;render();return}
  if(a==="nav"){ui.tela=t.dataset.t}
  else if(a==="mes"){ui.mes=madd(ui.mes,+t.dataset.d)}
  else if(a==="visao"){ui.visao=t.dataset.v}
  else if(a==="mini"){ui.mini=!ui.mini}
  else if(a==="tema"){var th=document.documentElement.getAttribute("data-theme");var d=th?th==="dark":matchMedia("(prefers-color-scheme:dark)").matches;th=d?"light":"dark";document.documentElement.setAttribute("data-theme",th);lsSet(LST,th)}
  else if(a==="perfil"){ui.perfil=t.dataset.id;lsSet(LSP,ui.perfil)}
  else if(a==="troca"){ui.perfil=null;lsSet(LSP,"")}
  else if(a==="reset"){if(confirm("Zerar todos os lançamentos e voltar ao início?")){S=seed();persist();lsSet(LSP,"");ui.perfil=null;ui.intro=true}}
  else if(a==="novo"){ui.sheet=true;draft.cat=null}
  else if(a==="fecha"){ui.sheet=false;ui._f=0}
  else if(a==="cat"){draft.cat=t.dataset.id;var v=$("#val").value,d=$("#desc").value;render();$("#val").value=v;$("#desc").value=d;return}
  else if(a==="salva"){salvar();return}
  else if(a==="undo"){S.lancamentos=S.lancamentos.filter(function(l){return l.id!==ui._undo});persist();ui.toast=null}
  else if(a==="exp"){var j=JSON.stringify(S,null,2),dl=window.claude&&claude.use?claude.use("downloads"):Promise.resolve(null);dl.then(function(x){if(x){x.save({filename:"casa-em-dia-backup.json",data:j}).catch(function(){})}else{try{var b=new Blob([j],{type:"application/json"}),u=URL.createObjectURL(b),k=document.createElement("a");k.href=u;k.download="casa-em-dia-backup.json";k.click()}catch(er){toast("Exportação indisponível neste ambiente.")}}});return}
  render()});
document.addEventListener("input",function(e){if(e.target.id==="busca"){ui.busca=e.target.value;if(ui.tela!=="lanc")ui.tela="lanc";render()}});
document.addEventListener("change",function(e){if(e.target.id==="imp"){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);if(!o.lancamentos||!o.pessoas)throw 0;S=o;persist();toast("Backup restaurado");render()}catch(er){toast("Arquivo de backup inválido.")}};r.readAsText(f)}});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&ui.sheet){ui.sheet=false;ui._f=0;render()}});
render();load();
})();
</script>
</body>
</html>
